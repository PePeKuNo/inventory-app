    help_title: Format
    help: "<b>Numbers</b>: <code>D</code> decimal, <code>X</code> hex. A number after it adds leading zeros: <code>D4</code> → 0042, <code>X5</code> → 0A3F2. Text after the format is kept as is: <code>D3_</code> → 042_.<br><b>Date</b>: <code>yyyy</code> <code>yy</code> <code>MM</code> <code>dd</code> <code>ddd</code> (weekday) <code>HH</code> <code>mm</code> <code>ss</code>, other characters are kept.<br><b>Fixed</b>: any text, emoji too."
    types:
      fixed: Fixed text
      random20: 20-bit random
      random32: 32-bit random
      random6: 6-digit random
      random9: 9-digit random
      guid: GUID
      datetime: Date/time
      sequence: Sequence
    hints:
      fixed: A piece of unchanging text. You can use Unicode emoji.
      random20: A random value. E.g. format it as six-digit decimal (D6) or 5-digit hex (X5).
      random32: A random value. E.g. format it as 8-digit hex (X8).
      random6: A random 6-digit number (D6 by default).
      random9: A random 9-digit number (D9 by default).
      guid: A globally unique identifier, no format options.
      datetime: Item creation date and time. E.g. use an abbreviated day of the week (ddd).
      sequence: A sequential index. Format with leading zeros (D4) or without them (D).
