    help_title: Формат
    help: "<b>Числа</b>: <code>D</code> десяткове, <code>X</code> шістнадцяткове. Число після літери додає нулі попереду: <code>D4</code> → 0042, <code>X5</code> → 0A3F2. Текст після формату залишається як є: <code>D3_</code> → 042_.<br><b>Дата</b>: <code>yyyy</code> <code>yy</code> <code>MM</code> <code>dd</code> <code>ddd</code> (день тижня) <code>HH</code> <code>mm</code> <code>ss</code>, інші символи залишаються.<br><b>Фіксований</b>: будь-який текст, також емодзі."
