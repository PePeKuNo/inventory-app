      random32: Випадкове значення. Напр., 8-значне hex (X8).
      random6: Випадкове 6-значне число (за замовчуванням D6).
      random9: Випадкове 9-значне число (за замовчуванням D9).
      guid: Глобально унікальний ідентифікатор, без налаштувань формату.
      datetime: Дата й час створення предмета. Напр., скорочений день тижня (ddd).
      sequence: Порядковий номер. З нулями попереду (D4) або без них (D).
