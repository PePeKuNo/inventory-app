  privacy:
    title: Політика конфіденційності
    body: |
      Це навчальний проєкт. Під час входу через Google або GitHub ми отримуємо лише ваше ім'я та email.
      Вони потрібні, щоб показувати авторів інвентарів, предметів і повідомлень та керувати доступом. Ми нікому їх не передаємо.
      Зображення зберігаються в Cloudinary. Ви можете будь-коли попросити адміністратора видалити ваш акаунт і дані.
