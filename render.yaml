databases:
  - name: inventory-db
    plan: free

services:
  - type: web
    name: inventory-app
    runtime: ruby
    plan: free
    buildCommand: bundle install && bin/rails assets:precompile
    startCommand: bin/rails db:prepare && bin/rails admin:promote && bin/rails server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      # Asked for when the Blueprint is created (see .env.example).
      - key: ADMIN_EMAIL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: WEB_CONCURRENCY
        value: 0
