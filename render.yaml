databases:
  - name: inventory-db
    plan: free

services:
  - type: web
    name: inventory-app
    runtime: ruby
    plan: free
    buildCommand: bundle install && bin/rails assets:precompile
    startCommand: bin/rails db:prepare && bin/rails server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: inventory-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 0
